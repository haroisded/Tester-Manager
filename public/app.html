<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Manager</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">Testing<span>.manager</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home">Tests</a>
      <a href="#/concerns" data-nav="concerns">Concerns</a>
      <a href="#/users" data-nav="users" id="nav-users" hidden>Users</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Switch light or dark mode" title="Light / dark">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="bell-wrap" hidden>
        <button class="icon-btn" id="bell" aria-label="Notifications" aria-expanded="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          </svg>
          <span class="badge" hidden></span>
        </button>
        <div class="panel" id="bell-panel" hidden></div>
      </div>
      <button class="avatar" id="avatar" aria-label="Profile"></button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="print"></div>
<div id="toast" role="status" hidden></div>

<dialog id="profile" class="modal">
  <div class="modal-head"><span class="eyebrow">Profile</span><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
  <div id="profile-main" class="modal-body">
    <div class="profile-head">
      <span class="avatar lg" id="profile-avatar"></span>
      <div><h2 id="profile-name"></h2><p class="meta" id="role"></p></div>
    </div>
    <form id="profile-form">
      <label class="label" for="new-name">Username</label>
      <div class="row">
        <input id="new-name" autocomplete="username" required>
        <button class="btn">Save</button>
      </div>
      <p class="error" id="profile-error" role="alert"></p>
    </form>
    <label class="label" for="my-password">Password</label>
    <div class="row">
      <input id="my-password" type="password" readonly>
      <button type="button" class="btn" id="toggle-password" aria-controls="my-password">Show</button>
    </div>
    <p class="hint" id="password-hint" hidden>Sign out and back in to see it here.</p>
    <div class="modal-foot">
      <button type="button" class="btn" id="signout">Sign out</button>
      <button type="button" class="link danger" id="delete-account" hidden>Delete account</button>
    </div>
  </div>
  <div id="profile-delete" class="modal-body" hidden>
    <h2>Delete your account?</h2>
    <p class="muted">This permanently deletes your account, answers, problems and images.</p>
    <p class="error" id="delete-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="confirm-delete">Delete my account</button>
      <button type="button" class="btn" id="cancel-delete">Cancel</button>
    </div>
  </div>
</dialog>

<dialog id="confirm" class="modal">
  <div class="modal-head"><span class="eyebrow">Confirm</span><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
  <div class="modal-body">
    <h2 id="confirm-title"></h2>
    <p class="muted" id="confirm-body"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="confirm-yes">Delete</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </div>
</dialog>

<dialog id="lightbox" aria-label="Image preview"><img alt=""></dialog>

<script src="app.js"></script>
</body>
</html>
